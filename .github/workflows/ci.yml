name: CI — Al-Waha Market

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate signing config (CI)
        run: |
          echo "KEYSTORE_PATH=${{ secrets.KEYSTORE_PATH }}"
          echo "STORE_PASSWORD present? ${{ secrets.STORE_PASSWORD != '' }}"
          echo "KEY_PASSWORD present? ${{ secrets.KEY_PASSWORD != '' }}"
        continue-on-error: true

      - name: Assemble Debug (isMinifyEnabled, isCrunchPngs)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run Unit Tests (Robolectric + Room + RAG)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      # Optional: connectedCheck requires emulator, uncomment when self-hosted runner available
      # - name: Instrumented Tests
      #   uses: reactivecircus/android-emulator-runner@v2
      #   with:
      #     api-level: 34
      #     target: google_apis
      #     arch: x86_64
      #     script: ./gradlew :app:connectedCheck --stacktrace

  release:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: gradle/actions/setup-gradle@v3
      - name: Decode keystore
        if: env.KEYSTORE_PATH != ''
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
      - name: Assemble Release (R8)
        run: ./gradlew :app:assembleRelease --stacktrace
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
